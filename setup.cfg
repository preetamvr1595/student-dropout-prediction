[metadata]
name = student-dropout-prediction
version = 1.0.0
author = Preetham V R
description = End-to-end ML pipeline for student dropout risk prediction

[options]
python_requires = >=3.10
packages = find:

[tool:pytest]
testpaths = tests
addopts = -v --tb=short

[flake8]
max-line-length = 120
exclude = .git,__pycache__,mlruns,.venv
